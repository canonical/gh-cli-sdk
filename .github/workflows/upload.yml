# Single `latest` track. Multi-base SDK, so platforms are BASE:ARCH pairs
# matching sdkcraft.yaml and the platform flag is --platform.
# One matrix entry per architecture because arm64 needs an ARM runner.
# `risk` is left at the sdkcraft-actions default (edge); setting
# `risk: "stable"` is the promotion step.

name: Build and Upload SDK

on:
  push:
    branches:
      - "latest"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch name (latest)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-upload:
    strategy:
      matrix:
        include:
          - arch: amd64
            runs-on: '["self-hosted-linux-amd64-noble-medium"]'
          - arch: arm64
            runs-on: '["self-hosted-linux-arm64-noble-medium"]'
    uses: canonical/sdkcraft-actions/.github/workflows/upload.yml@main
    with:
      platforms: '["ubuntu@22.04:${{ matrix.arch }}","ubuntu@24.04:${{ matrix.arch }}","ubuntu@26.04:${{ matrix.arch }}"]'
      platform-flag: "--platform"
      runs-on: ${{ matrix.runs-on }}
      track: "latest"
    secrets:
      SDKCRAFT_STORE_CREDENTIALS: ${{ secrets.SDKCRAFT_STORE_CREDENTIALS_PROD }}
